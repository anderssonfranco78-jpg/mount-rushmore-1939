function buildMiniVoxelMesh(voxels, voxelSize = 1.0, mat = coarseVoxelMat, castShadow = true) {
  const map = new Map();
  const key = (x, y, z) => `${x},${y},${z}`;
  let minX = 1e9, minY = 1e9, minZ = 1e9, maxX = -1e9, maxY = -1e9, maxZ = -1e9;
  for (const v of voxels) {
    map.set(key(v.x, v.y, v.z), v.c);
    if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
    if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    if (v.z < minZ) minZ = v.z; if (v.z > maxZ) maxZ = v.z;
  }
  const nx = maxX - minX + 1, ny = maxY - minY + 1, nz = maxZ - minZ + 1;
  return buildChunkedVoxelMeshes({
    nx, ny, nz,
    originX: (minX - 0.5) * voxelSize,
    originY: (minY - 0.5) * voxelSize,
    originZ: (minZ - 0.5) * voxelSize,
    voxelSize,
    chunkSize: Math.max(nx, ny, nz) + 1,
    getCell: (ix, iy, iz) => map.get(key(minX + ix, minY + iy, minZ + iz)) || 0,
    isOccluder: (ix, iy, iz) => map.has(key(minX + ix, minY + iy, minZ + iz)),
    material: mat,
    castShadow,
    receiveShadow: true,
    cavitySteps: 1,
  }).group;
}

function createBeveledUnitCubeGeo() {

    const tx = fc.t[0], ty = fc.t[1], tz = fc.t[2];
    const bx = fc.b[0], by = fc.b[1], bz = fc.b[2];
    pos.push(ox, oy, oz, ox + tx, oy + ty, oz + tz, ox + tx + bx, oy + ty + by, oz + tz + bz, ox + bx, oy + by, oz + bz);
    for (let k = 0; k < 4; k++) {
      nor.push(fc.n[0], fc.n[1], fc.n[2]);
      col.push(1, 1, 1);
      edg.push(1, 1, 1, 1);
      ao.push(fc.n[1] < -0.5 ? 0.65 : 0.96);
    }
    fuv.push(0, 0, 1, 0, 1, 1, 0, 1);
    idx.push(vc, vc + 1, vc + 2, vc, vc + 2, vc + 3);
    vc += 4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('aFaceUv', new THREE.Float32BufferAttribute(fuv, 2));
  geo.setAttribute('aEdgeMask', new THREE.Float32BufferAttribute(edg, 4));
  geo.setAttribute('aAO', new THREE.Float32BufferAttribute(ao, 1));
  geo.setIndex(idx);
  return geo;
}

const _dummy = new THREE.Object3D();
const _col = new THREE.Color();
const _vA = new THREE.Vector3();
const _vB = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _quat = new THREE.Quaternion();

function setPart(im, idx, px, py, pz, rx, ry, rz, sx, sy, sz, hex) {
  _dummy.position.set(px, py, pz);
  _dummy.rotation.set(rx, ry, rz);
  _dummy.scale.set(sx, sy, sz);
  _dummy.updateMatrix();
  im.setMatrixAt(idx, _dummy.matrix);
  _col.setHex(hex);
  im.setColorAt(idx, _col);
}

function hideInstance(im, idx) {
  _dummy.position.set(0, -9999, 0);
  _dummy.scale.set(0.0001, 0.0001, 0.0001);
  _dummy.updateMatrix();
  im.setMatrixAt(idx, _dummy.matrix);
}

function updateSceneAtTime(t) {
  skyMat.uniforms.uTime.value = t;

  for (let i = 0; i < floatingIslets.length; i++) {
    const isl = floatingIslets[i];
    isl.grp.position.set(
      isl.baseX + Math.sin(t * 0.35 + isl.phase) * 0.85,
      isl.baseY + Math.sin(t * 0.85 + isl.phase) * 0.75,
      isl.baseZ + Math.cos(t * 0.30 + isl.phase) * 0.65
    );
  }
  for (let i = 0; i < voxelClouds.length; i++) {
    const cl = voxelClouds[i];
    const isPlay = (typeof gameState !== 'undefined' && gameState.mode === 'play');
    cl.grp.position.x = cl.baseX + (isPlay ? Math.sin(t * 0.16 + i) * 3.4 : (Math.sin(t * 0.18 + i) * 1.2 + (t - 6.0) * cl.speed));
    cl.grp.position.y = cl.baseY + Math.sin(t * 0.5 + i * 1.7) * 0.35;
  }

  const flicker = 0.78 + 0.15 * Math.sin(t * 14.3) + 0.11 * Math.sin(t * 27.7 + 1.1) + 0.08 * Math.cos(t * 8.9);
  forgeLight.intensity = 36.0 * flicker;
  glowForgeMat.emissiveIntensity = 3.6 * flicker;

  const flagIM = window.__flagIM;
  for (let i = 0; i < flagColumns.length; i++) {
    const fc = flagColumns[i];
    const waveZ = Math.sin(fc.col * 0.48 - t * 6.8) * (fc.col * 0.042);
    const waveY = Math.cos(fc.col * 0.35 - t * 5.2) * (fc.col * 0.014);
    _dummy.position.set(fc.poleX + (fc.col + 0.5) * fc.s, fc.poleY + (fc.row + 0.5) * fc.s + waveY, fc.poleZ + waveZ);
    _dummy.rotation.set(0, Math.cos(fc.col * 0.48 - t * 6.8) * 0.16, 0);
    _dummy.scale.set(fc.s * 1.04, fc.s * 1.04, fc.s * 0.55);
    _dummy.updateMatrix();
    flagIM.setMatrixAt(fc.idx, _dummy.matrix);
  }
  flagIM.instanceMatrix.needsUpdate = true;

  // Aerial Tramway Car climbs smoothly to summit and comes back down!
  const cyclePhase = (t / DURATION) * Math.PI * 2.0;
  const tramU = clamp(0.52 - 0.44 * Math.cos(cyclePhase * 0.92 + 0.25), 0.06, 0.96);
  tramCarGroup.position.copy(evalTramCablePos(tramU, 0));
  tramCarGroup.rotation.z = Math.sin(t * 2.6) * 0.055;
  tramCarGroup.rotation.x = Math.cos(t * 2.1) * 0.045;

  for (let i = 0; i < movingTrucks.length; i++) {
    const tr = movingTrucks[i];
    const rawU = (tr.baseU + t * tr.speed) % 1.68;
    const u = rawU <= 0.84 ? (0.06 + rawU) : (0.90 - (rawU - 0.84));
    const uClamped = clamp(u, 0.04, 0.94);
    const dirSign = rawU <= 0.84 ? 1 : -1;
    const pos = roadCurve.getPoint(uClamped);
    const target = roadCurve.getPoint(clamp(uClamped + dirSign * 0.015, 0.01, 0.99));
    tr.grp.position.set(pos.x, pos.y + 0.18 + Math.abs(Math.sin(t * 16 + i)) * 0.04, pos.z);
    tr.grp.lookAt(target.x, target.y + 0.18, target.z);
  }

  for (let i = 0; i < NUM_BIRDS; i++) {
    const ang = t * (0.48 + (i % 3) * 0.08) + i * ((Math.PI * 2) / NUM_BIRDS);
    const rad = 18.0 + (i % 4) * 5.2 + Math.sin(t * 0.7 + i) * 2.2;
    const bx = -1.0 + Math.cos(ang) * rad;
    const bz = -3.0 + Math.sin(ang) * (rad * 0.72);
    const by = 45.0 + (i % 3) * 2.0 + Math.sin(ang * 2.0 + i) * 1.3;
    const heading = -ang + Math.PI * 0.5;
    const flap = Math.sin(t * 7.5 + i * 2.1) * 0.48;

    const baseIdx = i * 3;
    setPart(birdsIM, baseIdx, bx, by, bz, 0, heading, 0.18, 0.28, 0.18, 0.65, 0x382a22);
    const cosH = Math.cos(heading), sinH = Math.sin(heading);
    setPart(birdsIM, baseIdx + 1, bx - cosH * 0.46, by + Math.sin(flap) * 0.18, bz + sinH * 0.46, 0, heading, flap + 0.18, 0.68, 0.09, 0.34, 0x503e32);
    setPart(birdsIM, baseIdx + 2, bx + cosH * 0.46, by + Math.sin(flap) * 0.18, bz - sinH * 0.46, 0, heading, -flap + 0.18, 0.68, 0.09, 0.34, 0x503e32);
  }
  birdsIM.instanceMatrix.needsUpdate = true;

  let pIdx = 0;
  const skinHex = 0xf0c29c;

  for (let i = 0; i < PEOPLE.length; i++) {
    const p = PEOPLE[i];
    if (p.role === 'carver') {
      const cv = CARVERS[p.carverIdx];
      const swingX = Math.sin(t * cv.freq + cv.phase) * cv.swing;
      const swingZ = Math.cos(t * cv.freq * 0.8 + cv.phase) * 0.12;
      const drillActive = Math.sin(t * 2.2 + cv.phase * 1.7) > -0.35;
      const buzz = drillActive ? Math.sin(t * 48.0 + i) * 0.045 : 0.0;

      const cx = cv.base[0] + swingX + buzz;
      const cy = cv.base[1] + Math.abs(swingX) * 0.08;
      const cz = cv.base[2] + swingZ;

      _vA.set(cv.anchor[0], cv.anchor[1], cv.anchor[2]);
      _vB.set(cx, cy + 0.65, cz);
      const cableMesh = bosunCableMeshes[p.carverIdx];
      cableMesh.position.lerpVectors(_vA, _vB, 0.5);
      cableMesh.scale.set(1, _vA.distanceTo(_vB), 1);
      _quat.setFromUnitVectors(_up, _vB.clone().sub(_vA).normalize());
      cableMesh.quaternion.copy(_quat);

      setPart(peopleIM, pIdx++, cx, cy - 0.18, cz, 0, 0, 0, 0.62, 0.12, 0.46, 0x9c6e44);
      setPart(peopleIM, pIdx++, cx - 0.13, cy - 0.08, cz - 0.22, 0, 0, 0, 0.18, 0.20, 0.42, p.pants);
      setPart(peopleIM, pIdx++, cx + 0.13, cy - 0.08, cz - 0.22, 0, 0, 0, 0.18, 0.20, 0.42, p.pants);
      setPart(peopleIM, pIdx++, cx, cy + 0.24, cz, 0.12, 0, 0, 0.42, 0.48, 0.28, p.shirt);
      setPart(peopleIM, pIdx++, cx, cy + 0.62, cz - 0.04, 0, 0, 0, 0.30, 0.30, 0.30, skinHex);
      setPart(peopleIM, pIdx++, cx, cy + 0.80, cz - 0.04, 0, 0, 0, 0.38, 0.14, 0.38, p.hat);
      setPart(peopleIM, pIdx++, cx - 0.24, cy + 0.26, cz - 0.24, 0.2, 0, 0, 0.15, 0.16, 0.44, p.shirt);
      setPart(peopleIM, pIdx++, cx + 0.24, cy + 0.26, cz - 0.24, 0.2, 0, 0, 0.15, 0.16, 0.44, p.shirt);
      setPart(peopleIM, pIdx++, cx, cy + 0.22, cz - 0.48 + buzz, 0, 0, 0, 0.20, 0.22, 0.42, 0x484e56);
      setPart(peopleIM, pIdx++, cx, cy + 0.22, cz - 0.82 + buzz, 0, 0, 0, 0.08, 0.08, 0.48, 0xb8c0c8);
      continue;
    }

    let px = p.x, py = p.y, pz = p.z, yaw = p.yaw || 0;
    let stride = 0, armL = 0, armR = 0;

    if (p.role === 'wheelbarrow') {
      const spanA = -11.5 + p.slot * 5.4;
      const spanB = spanA + 4.5;
      const pingPong = 0.5 - 0.5 * Math.cos(t * 0.95 + p.phase);
      px = mix(spanA, spanB, pingPong);
      pz = 24.3 - Math.abs(px) * 0.20;
      const mIdx = (Math.round(pz) - GZ0) * NX + (Math.round(px) - GX0);
      py = (inCoarse(Math.round(px), 10, Math.round(pz)) ? surfaceTopMap[mIdx] : 11) + 0.5;
      const dir = Math.sin(t * 0.95 + p.phase) >= 0 ? 1 : -1;
      yaw = dir > 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
      stride = Math.sin(t * 6.5 + p.phase) * 0.55;
      armL = -0.75; armR = -0.75;

      const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
      const wbx = px + fwdX * 0.95, wbz = pz + fwdZ * 0.95;
      setPart(peopleIM, pIdx++, wbx, py + 0.36, wbz, 0, yaw, 0, 0.62, 0.34, 0.78, 0x7c4a32);
      setPart(peopleIM, pIdx++, wbx, py + 0.58, wbz, 0, yaw, 0, 0.48, 0.24, 0.56, 0xc8c6c2);
      setPart(peopleIM, pIdx++, wbx + fwdX * 0.44, py + 0.18, wbz + fwdZ * 0.44, t * 5.0 * dir, yaw, 0, 0.16, 0.34, 0.34, 0x2e3034);
    }
    else if (p.role === 'crate_carrier') {
      const r = p.route;
      const pingPong = 0.5 - 0.5 * Math.cos(t * 0.85 + p.phase);
      px = mix(r.ax, r.bx, pingPong);
      pz = mix(r.az, r.bz, pingPong);
      py = r.y + 0.5;
      const dir = Math.sin(t * 0.85 + p.phase) >= 0 ? 1 : -1;
      yaw = Math.atan2((r.bx - r.ax) * dir, (r.bz - r.az) * dir);
      stride = Math.sin(t * 6.2 + p.phase) * 0.52;
      armL = -0.95; armR = -0.95;
      const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
      setPart(peopleIM, pIdx++, px + fwdX * 0.44, py + 0.82, pz + fwdZ * 0.44, 0, yaw, 0, 0.46, 0.38, 0.42, 0xc99c5e);
    }
    else if (p.role === 'ledge_hammer' || p.role === 'blacksmith') {
      const swing = Math.sin(t * (p.role === 'blacksmith' ? 6.8 : 5.6) + p.phase);
      armR = -1.35 + swing * 0.85; armL = -0.45;
      const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
      setPart(peopleIM, pIdx++, px + fwdX * 0.52, py + 0.95 - swing * 0.32, pz + fwdZ * 0.52, armR, yaw, 0, 0.14, 0.16, 0.56, 0x565a62);
    }
    else if (p.role === 'ledge_drill') {
      px += Math.sin(t * 44.0 + p.phase) * 0.04;
      armL = -0.85; armR = -0.85;
      const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
      setPart(peopleIM, pIdx++, px + fwdX * 0.46, py + 0.65, pz + fwdZ * 0.46, 0.3, yaw, 0, 0.20, 0.42, 0.22, 0x484e56);
    }
    else if (p.role === 'point') {
      armR = -1.95 + Math.sin(t * 2.1 + p.phase) * 0.14;
      armL = Math.sin(t * 1.4 + p.phase) * 0.12;
    }
    else if (p.role === 'wave') {
      armR = -2.45 + Math.sin(t * 7.2 + p.phase) * 0.38;
      armL = 0.15;
    }
    else if (p.role === 'stroll' || p.role === 'parasol_stroll') {
      const walkOff = Math.sin(t * 0.72 + p.phase) * 1.45;
      const dir = Math.cos(t * 0.72 + p.phase) >= 0 ? 1 : -1;
      px += Math.cos(p.yaw) * walkOff;
      pz -= Math.sin(p.yaw) * walkOff * 0.4;
      yaw = p.yaw + (dir < 0 ? Math.PI * 0.35 : 0);
      stride = Math.sin(t * 5.2 + p.phase) * 0.42;
      armL = -stride * 0.7;
      armR = p.parasolCol ? -1.15 : stride * 0.7;
    }
    else if (p.role === 'parasol_admire') {
      yaw = p.yaw + Math.sin(t * 0.8 + p.phase) * 0.22;
      armR = -1.15;
      armL = -1.75 + Math.sin(t * 1.9 + p.phase) * 0.12;
    }

    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    if (p.isLady) {
      setPart(peopleIM, pIdx++, px, py + 0.32, pz, stride * 0.15, yaw, 0, 0.44, 0.52, 0.34, p.pants);
      setPart(peopleIM, pIdx++, px - cosY * 0.10, py + 0.08, pz + sinY * 0.10, stride, yaw, 0, 0.14, 0.22, 0.16, skinHex);
      setPart(peopleIM, pIdx++, px + cosY * 0.10, py + 0.08, pz - sinY * 0.10, -stride, yaw, 0, 0.14, 0.22, 0.16, skinHex);
    } else {
      setPart(peopleIM, pIdx++, px - cosY * 0.11, py + 0.24, pz + sinY * 0.11, stride, yaw, 0, 0.17, 0.48, 0.18, p.pants);
      setPart(peopleIM, pIdx++, px + cosY * 0.11, py + 0.24, pz - sinY * 0.11, -stride, yaw, 0, 0.17, 0.48, 0.18, p.pants);
    }
    setPart(peopleIM, pIdx++, px, py + 0.72, pz, 0, yaw, 0, 0.40, 0.48, 0.26, p.shirt);
    setPart(peopleIM, pIdx++, px, py + 1.12, pz, 0, yaw, 0, 0.28, 0.28, 0.28, skinHex);
    setPart(peopleIM, pIdx++, px, py + 1.30, pz, 0, yaw, 0, p.isLady ? 0.44 : 0.38, 0.12, p.isLady ? 0.44 : 0.38, p.hat);

    const lx = px - cosY * 0.27, lz = pz + sinY * 0.27;
    const rx = px + cosY * 0.27, rz = pz - sinY * 0.27;
    const lFwd = -Math.sin(armL) * 0.18, lUp = (1.0 - Math.cos(armL)) * 0.18;
    const rFwd = -Math.sin(armR) * 0.18, rUp = (1.0 - Math.cos(armR)) * 0.18;
    setPart(peopleIM, pIdx++, lx + sinY * lFwd, py + 0.72 + lUp, lz + cosY * lFwd, armL, yaw, 0, 0.14, 0.42, 0.14, p.shirt);
    setPart(peopleIM, pIdx++, rx + sinY * rFwd, py + 0.72 + rUp, rz + cosY * rFwd, armR, yaw, 0, 0.14, 0.42, 0.14, p.shirt);

    if (p.parasolCol) {
      const tilt = 0.18 + Math.sin(t * 1.6 + p.phase) * 0.06;
      const paraX = rx + cosY * 0.08, paraZ = rz - sinY * 0.08;
      const spin = t * 0.9 + p.phase;
      setPart(peopleIM, pIdx++, paraX, py + 1.34, paraZ, -tilt, yaw, 0, 0.07, 0.95, 0.07, 0x8c623c);
      setPart(peopleIM, pIdx++, paraX, py + 1.78, paraZ - tilt * 0.35, -tilt, spin, 0, 1.12, 0.14, 1.12, p.parasolCol);
      setPart(peopleIM, pIdx++, paraX, py + 1.90, paraZ - tilt * 0.38, -tilt, spin + 0.4, 0, 0.66, 0.14, 0.66, 0xfaf6ee);
    }
  }
  for (let rest = pIdx; rest < MAX_PERSON_PARTS; rest++) hideInstance(peopleIM, rest);
  peopleIM.instanceMatrix.needsUpdate = true;
  peopleIM.instanceColor.needsUpdate = true;

  // Particles
  let sIdx = 0;
  let mIdx = 0;

  for (let i = 0; i < CARVERS.length; i++) {
    const cv = CARVERS[i];
    if (Math.sin(t * 2.2 + cv.phase * 1.7) <= -0.35) continue;
    const cx = cv.base[0] + Math.sin(t * cv.freq + cv.phase) * cv.swing;
    const cy = cv.base[1] + 0.22;
    const cz = cv.base[2] - 0.85;
    for (let k = 0; k < 8; k++) {
      const age = (t * 1.9 + i * 0.37 + k / 8.0) % 1.0;
      const sz = (0.16 + age * 0.46) * (1.0 - age * 0.72);
      setPart(solidParticlesIM, sIdx++, cx + Math.sin(i * 5 + k * 2.3) * age * 0.85, cy - age * age * 1.25 + age * 0.25, cz + 0.25 + age * 1.15, age * 2, age * 3, 0, sz, sz, sz, 0xe4e0d8);
    }
  }
  for (const gx of [-7.5, 2.0, 10.5]) {
    const gz = gx === 2.0 ? 9.6 : 11.6;
    for (let k = 0; k < 5; k++) {
      const age = (t * 1.7 + gx * 0.2 + k / 5.0) % 1.0;
      const sz = (0.18 + age * 0.45) * (1.0 - age * 0.7);
      setPart(solidParticlesIM, sIdx++, gx + Math.sin(k * 3.1) * age * 0.7, 21.0 + age * 0.4 - age * age * 0.8, gz + age * 0.9, age, age * 2, 0, sz, sz, sz, 0xdfdbd2);
    }
  }

  // Dynamite Blast every 3.8s!
  const blastShifted = t + 2.7;
  const blastIndex = Math.floor(blastShifted / BLAST_PERIOD);
  const tau = blastShifted - blastIndex * BLAST_PERIOD;
  const bSite = BLAST_SITES[Math.abs(blastIndex) % BLAST_SITES.length];

  if (tau >= 0.0 && tau < 0.22) {
    const flash = 1.0 - tau / 0.22;
    blastLight.position.copy(bSite).add(new THREE.Vector3(0, 0.5, 1.5));
    blastLight.intensity = flash * flash * 85.0;
    const fSz = 0.8 + tau * 9.5;
    setPart(mistParticlesIM, mIdx++, bSite.x, bSite.y, bSite.z + 0.6, tau * 5, tau * 7, 0, fSz, fSz, fSz, 0xffd27a);
  } else {
    blastLight.intensity = 0.0;
  }

  if (tau >= 0.0 && tau < 3.1) {
    for (let i = 0; i < blastChipSeeds.length && sIdx < MAX_SOLID_PARTICLES - 80; i++) {
      const ch = blastChipSeeds[i];
      if (tau > 2.55) continue;
      const px = bSite.x + ch.vx * tau;
      const py = bSite.y + ch.vy * tau - 0.5 * 14.5 * tau * tau;
      const pz = bSite.z + ch.vz * tau;
      if (py < 7.0) continue;
      const sz = ch.sz * (1.0 - smoothstep(2.0, 2.55, tau));
      const gVal = Math.round(212 * ch.shade);
      setPart(solidParticlesIM, sIdx++, px, py, pz, ch.rx * tau, ch.ry * tau, ch.rz * tau, sz, sz * 0.8, sz * 1.1, (gVal << 16) | ((gVal - 3) << 8) | (gVal - 8));
    }
    for (let i = 0; i < blastDustSeeds.length && sIdx < MAX_SOLID_PARTICLES - 30; i++) {
      const ds = blastDustSeeds[i];
      if (tau > ds.life) continue;
      const prog = tau / ds.life;
      const drag = (1.0 - Math.exp(-tau * 2.4)) / 2.4;
      const px = bSite.x + ds.vx * drag * 2.2 + tau * 0.6;
      const py = bSite.y + ds.vy * drag * 1.8 + tau * 0.85;
      const pz = bSite.z + ds.vz * drag * 2.2;
      const sz = ds.sz * (0.35 + prog * 1.65) * (1.0 - Math.pow(prog, 2.2));
      const gVal = Math.round(226 * ds.shade);
      setPart(solidParticlesIM, sIdx++, px, py, pz, tau * 0.8, tau * 1.1, 0, sz, sz, sz, (gVal << 16) | ((gVal - 5) << 8) | (gVal - 12));
    }
  }

  // Red Compressor House Chimney Smoke (-14, 18.6, 32) — drifts gently westward so Washington's face stays 100% clear!
  for (let i = 0; i < 34 && sIdx < MAX_SOLID_PARTICLES - 20; i++) {
    const age = (t * 0.42 + i / 34.0) % 1.0;
    const sx = -14.0 - age * 4.2 + Math.sin(age * 6.5 + i) * 0.50;
    const sy = 18.6 + age * 9.5;
    const szPos = 32.0 + age * 1.2 + Math.cos(age * 5.2 + i) * 0.45;
    const scale = (0.38 + age * 1.40) * (1.0 - Math.pow(age, 2.4));
    const shade = Math.round(mix(148, 224, age));
    setPart(solidParticlesIM, sIdx++, sx, sy, szPos, age * 1.5, age * 2.1, 0, scale, scale, scale, (shade << 16) | (shade << 8) | (shade + 4));
  }

  for (let i = 0; i < movingTrucks.length; i++) {
    const tr = movingTrucks[i].grp.position;
    for (let k = 0; k < 5 && sIdx < MAX_SOLID_PARTICLES; k++) {
      const age = (t * 1.8 + i * 0.4 + k / 5.0) % 1.0;
      const sz = (0.22 + age * 0.55) * (1.0 - age);
      setPart(solidParticlesIM, sIdx++, tr.x + Math.sin(k * 2.4) * 0.5, tr.y + 0.25 + age * 0.65, tr.z + Math.cos(k * 2.4) * 0.5, age, age, 0, sz, sz, sz, 0xcab08a);
    }
  }

  // Waterfall Droplets & Mist Clouds
  for (let i = 0; i < 110 && mIdx < MAX_MIST_PARTICLES - 30; i++) {
    const age = (t * 0.68 + i / 110.0) % 1.0;
    const lane = ((i * 17) % 100) / 100.0 - 0.5;
    const wx = -34.0 + lane * (3.6 + age * 2.4) + Math.sin(age * 9.0 + i) * 0.35;
    const wy = 3.8 - age * age * 19.2;
    const wz = 50.8 + Math.min(3.4, age * 4.0) + Math.cos(i * 2.3) * 0.45;
    const sz = 0.28 + age * 0.52;
    setPart(mistParticlesIM, mIdx++, wx, wy, wz, age * 4, age * 3, 0, sz, sz * 1.5, sz, 0xd8f0fc);
  }
  for (let i = 0; i < 65 && mIdx < MAX_MIST_PARTICLES - 22; i++) {
    const age = (t * 0.36 + i / 65.0) % 1.0;
    const ang = i * 2.399;
    const rad = (0.8 + (i % 5) * 0.52) * (0.5 + age * 1.7);
    const mx = -34.0 + Math.cos(ang) * rad;
    const my = -13.0 + Math.sin(i * 1.7) * 2.2 + age * 3.4;
    const mz = 53.2 + Math.sin(ang) * rad * 0.8 + age * 1.4;
    const sz = (0.82 + age * 1.95) * Math.sin(age * Math.PI);
    setPart(mistParticlesIM, mIdx++, mx, my, mz, age, age * 1.3, 0, sz, sz * 0.85, sz, 0xeef8ff);
  }

  // Forge Sparks
  for (let i = 0; i < 18 && mIdx < MAX_MIST_PARTICLES; i++) {
    const age = (t * 1.15 + i / 18.0) % 1.0;
    const sx = -1.4 + Math.sin(age * 8.0 + i * 2.1) * 0.55;
    const sy = 8.3 + age * 3.8;
    const szPos = 34.5 + Math.cos(age * 7.0 + i * 1.7) * 0.55;
    const sz = 0.14 * (1.0 - age * 0.8);
    setPart(mistParticlesIM, mIdx++, sx, sy, szPos, 0, 0, 0, sz, sz, sz, i % 2 === 0 ? 0xffb830 : 0xff6a12);
  }

  // Dynamic Player Demolition Particles & Thrown Dynamite Sticks
  if (typeof updateInteractiveParticles === 'function') {
    const counts = updateInteractiveParticles(t, sIdx, mIdx);
    sIdx = counts.sIdx;
    mIdx = counts.mIdx;
  }

  for (let r = sIdx; r < MAX_SOLID_PARTICLES; r++) hideInstance(solidParticlesIM, r);
  for (let r = mIdx; r < MAX_MIST_PARTICLES; r++) hideInstance(mistParticlesIM, r);
  solidParticlesIM.instanceMatrix.needsUpdate = true;
  solidParticlesIM.instanceColor.needsUpdate = true;
  mistParticlesIM.instanceMatrix.needsUpdate = true;
  mistParticlesIM.instanceColor.needsUpdate = true;

  // CAMERA: Showcase Panoramic Orbit vs. Interactive Player Camera
  if (CLOSEUP_MODE) {
    if (CLOSEUP_FACE === 'washington') {
      camera.position.set(-19.8, 29.8, 32.0);
      camera.lookAt(-19.8, 29.0, 9.8);
    } else if (CLOSEUP_FACE === 'jefferson') {
      camera.position.set(-10.5, 31.0, 28.0);
      camera.lookAt(-6.6, 30.0, 6.8);
    } else if (CLOSEUP_FACE === 'roosevelt') {
      camera.position.set(4.5, 28.5, 25.5);
      camera.lookAt(5.0, 28.2, 3.1);
    } else if (CLOSEUP_FACE === 'lincoln') {
      camera.position.set(14.0, 29.5, 30.0);
      camera.lookAt(17.8, 28.6, 8.5);
    } else {
      camera.position.set(-0.8, 29.0, 62.0);
      camera.lookAt(-0.8, 28.0, 6.5);
    }
  } else if (typeof gameState !== 'undefined' && gameState.mode === 'play' && !manualCaptureMode) {
    updatePlayerCamera(t);
  } else {
    const uNorm = clamp((t % DURATION) / DURATION, 0.0, 1.0);
    const orbitProgress = mix(uNorm, smootherstep(0.0, 1.0, uNorm), 0.26);
    const startAngle = (-52.0 * Math.PI) / 180.0;
    const endAngle   = ( 48.0 * Math.PI) / 180.0; // 100.0° continuous showcase orbit!
    const userYaw = (typeof showcaseDrag !== 'undefined') ? showcaseDrag.yawOffset : 0.0;
    const userPitch = (typeof showcaseDrag !== 'undefined') ? showcaseDrag.pitchOffset : 0.0;
    const userZoom = (typeof showcaseDrag !== 'undefined') ? showcaseDrag.zoomOffset : 0.0;
    const theta = mix(startAngle, endAngle, orbitProgress) + userYaw;

    const zoomEase = smootherstep(0.0, 1.0, uNorm);
    const radius = clamp(mix(196.0, 172.0, zoomEase) + userZoom, 55.0, 260.0);
    const camElev = clamp(mix(31.5, 27.8, zoomEase) + userPitch * 45.0, -15.0, 95.0);

    const pivotX = -0.8;
    const pivotZ = 6.0;
    const lookY  = mix(11.4, 12.6, zoomEase);

    camera.position.set(
      pivotX + Math.sin(theta) * radius,
      camElev,
      pivotZ + Math.cos(theta) * radius
    );
    camera.lookAt(pivotX, lookY, pivotZ);
  }
}

function makeAvatarPart(sx, sy, sz, hex, ox = 0, oy = 0, oz = 0) {
  const pivot = new THREE.Group();
  const mat = createVoxelMaterial({ roughness: 0.8, metalness: 0.05, bevelStrength: 0.45 });
  const mesh = new THREE.Mesh(unitBoxGeo, mat);
  const col = new THREE.Color(hex);
  const cArr = mesh.geometry.attributes.color.array;
  const gClone = unitBoxGeo.clone();
  const cNew = new Float32Array(cArr.length);
  for (let i = 0; i < cNew.length; i += 3) {
    cNew[i] = col.r; cNew[i + 1] = col.g; cNew[i + 2] = col.b;
  }
  gClone.setAttribute('color', new THREE.BufferAttribute(cNew, 3));
  mesh.geometry = gClone;
  mesh.scale.set(sx, sy, sz);
  mesh.position.set(ox, oy, oz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  pivot.add(mesh);
  return { pivot, mesh };
}

function spawnBreakParticles(wx, wy, wz, hexColor, count = 18, speedScale = 1.0) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const elev = (Math.random() - 0.15) * Math.PI * 0.6;
    const spd = (2.5 + Math.random() * 5.5) * speedScale;
    activeDebris.push({
      x: wx + (Math.random() - 0.5) * 0.4,
      y: wy + (Math.random() - 0.5) * 0.4,
      z: wz + (Math.random() - 0.5) * 0.4,
      vx: Math.cos(ang) * Math.cos(elev) * spd,
      vy: Math.sin(elev) * spd + 2.5 * speedScale,
      vz: Math.sin(ang) * Math.cos(elev) * spd,
      sz: 0.16 + Math.random() * 0.22,
      color: hexColor,
      age: 0,
      maxAge: 0.75 + Math.random() * 0.65,
    });
  }
}

let lastParticleUpdateTime = 0;
function updateInteractiveParticles(t, sIdx, mIdx) {
  const dt = clamp(t - lastParticleUpdateTime, 0.001, 0.08);
  lastParticleUpdateTime = t;

  // Update thrown dynamite sticks
  for (let i = activeDynamites.length - 1; i >= 0; i--) {
    const dyn = activeDynamites[i];
    dyn.age += dt;
    dyn.vy -= 18.0 * dt;
    const nx = dyn.x + dyn.vx * dt;
    const ny = dyn.y + dyn.vy * dt;
    const nz = dyn.z + dyn.vz * dt;
    if (checkWorldSolid(nx, ny, nz).solid) {
      dyn.vx *= 0.35;
      dyn.vz *= 0.35;
      dyn.vy = Math.abs(dyn.vy) * 0.28;
    } else {
      dyn.x = nx; dyn.y = ny; dyn.z = nz;
    }

    if (sIdx < MAX_SOLID_PARTICLES - 4) {
      setPart(solidParticlesIM, sIdx++, dyn.x, dyn.y, dyn.z, dyn.age * 8, dyn.age * 5, 0, 0.22, 0.48, 0.22, 0xd8281c);
    }
    if (mIdx < MAX_MIST_PARTICLES - 4) {
      const sparkSz = 0.18 + Math.sin(dyn.age * 40) * 0.06;
      setPart(mistParticlesIM, mIdx++, dyn.x, dyn.y + 0.26, dyn.z, 0, 0, 0, sparkSz, sparkSz, sparkSz, 0xffe066);
    }

    if (dyn.age >= 1.55) {
      detonateDynamiteAt(dyn.x, dyn.y, dyn.z);
      activeDynamites.splice(i, 1);
    }
  }

  if (playerBlastFlash > 0) {
    playerBlastFlash = Math.max(0, playerBlastFlash - dt * 3.8);
    blastLight.position.copy(playerBlastPos).add(new THREE.Vector3(0, 0.8, 0.8));
    blastLight.intensity = Math.max(blastLight.intensity, playerBlastFlash * 110.0);
    if (mIdx < MAX_MIST_PARTICLES - 2) {
      const fSz = (1.0 - playerBlastFlash) * 7.5 + 1.0;
      setPart(mistParticlesIM, mIdx++, playerBlastPos.x, playerBlastPos.y, playerBlastPos.z, 0, 0, 0, fSz, fSz, fSz, 0xffd27a);
    }
  }

  for (let i = activeDebris.length - 1; i >= 0; i--) {
    const d = activeDebris[i];
    d.age += dt;
    if (d.age >= d.maxAge) {
      activeDebris.splice(i, 1);
      continue;
    }
    d.vy -= 16.0 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;
    const scale = d.sz * (1.0 - d.age / d.maxAge);
    if (sIdx < MAX_SOLID_PARTICLES - 2) {
      setPart(solidParticlesIM, sIdx++, d.x, d.y, d.z, d.age * 6, d.age * 9, 0, scale, scale, scale, d.color);
    }
  }

  return { sIdx, mIdx };
}

// World Collision & Voxel Query Mapping (Coarse Grid + 3.33x Fine Faces + Floating Islets + Voxel Clouds + Water)
function checkWorldSolid(wx, wy, wz) {
  // 1. Check 3.33x Fine Sculpt Grid around the 4 Presidents
  if (wx >= FINE_WX0 && wx <= FINE_WX1 && wy >= FINE_WY0 && wy <= FINE_WY1 && wz >= FINE_WZ0 && wz <= FINE_WZ1) {
    const ix = Math.floor((wx - FINE_OX) / V_FINE);
    const iy = Math.floor((wy - FINE_OY) / V_FINE);
    const iz = Math.floor((wz - FINE_OZ) / V_FINE);
    if (ix >= 0 && ix < FX_COUNT && iy >= 0 && iy < FY_COUNT && iz >= 0 && iz < FZ_COUNT) {
      const packed = fineGrid[fIdx(ix, iy, iz)];
      if (packed !== 0) {
        return { solid: true, grid: 'fine', ix, iy, iz, packed, voxelSize: V_FINE,
          cx: FINE_OX + (ix + 0.5) * V_FINE, cy: FINE_OY + (iy + 0.5) * V_FINE, cz: FINE_OZ + (iz + 0.5) * V_FINE };
      }
      if (evalFineSculptEnvelope(wx, wy, wz) > 0.25) {
        return { solid: false };
      }
    }
  }

  // 2. Check Coarse Island Grid
  const cx = Math.round(wx), cy = Math.round(wy), cz = Math.round(wz);
  if (inCoarse(cx, cy, cz)) {
    const packed = coarseGrid[cIdx(cx, cy, cz)];
    if (packed !== 0) {
      return { solid: true, grid: 'coarse', ix: cx - GX0, iy: cy - GY0, iz: cz - GZ0, wx: cx, wy: cy, wz: cz, packed, voxelSize: 1.0, cx, cy, cz };
    }
  }

  // 3. Check Floating Islets
  for (let i = 0; i < floatingIslets.length; i++) {
    const isl = floatingIslets[i];
    const gp = isl.grp.position;
    if (Math.abs(wx - gp.x) <= isl.radius && Math.abs(wz - gp.z) <= isl.radius && Math.abs(wy - gp.y) <= 10) {
      const lx = Math.round(wx - gp.x);
      const ly = Math.round(wy - gp.y);
      const lz = Math.round(wz - gp.z);
      if (isl.voxelSet.has(`${lx},${ly},${lz}`)) {
        return { solid: true, grid: 'islet', index: i, voxelSize: 1.0, cx: gp.x + lx, cy: gp.y + ly, cz: gp.z + lz, packed: packColor(94, 128, 56, 2) };
      }
    }
  }

  // 4. Check Voxel Clouds (Walkable in the sky!)
  for (let i = 0; i < voxelClouds.length; i++) {
    const cl = voxelClouds[i];
    const gp = cl.grp.position;
    if (Math.abs(wx - gp.x) <= cl.sx && Math.abs(wy - gp.y) <= cl.sy && Math.abs(wz - gp.z) <= cl.sz) {
      const lx = Math.round((wx - gp.x) / 1.1);
      const ly = Math.round((wy - gp.y) / 1.1);
      const lz = Math.round((wz - gp.z) / 1.1);
      if (cl.voxelSet.has(`${lx},${ly},${lz}`)) {
        return { solid: true, grid: 'cloud', index: i, voxelSize: 1.1, cx: gp.x + lx * 1.1, cy: gp.y + ly * 1.1, cz: gp.z + lz * 1.1, packed: packColor(245, 235, 220, 0) };
      }
    }
  }

  return { solid: false };
}

function isWaterAtWorld(wx, wy, wz) {
  const cx = Math.round(wx), cy = Math.round(wy), cz = Math.round(wz);
  if (!inCoarse(cx, cy, cz)) return false;
  return waterGrid[cIdx(cx, cy, cz)] !== 0;
}

// Modify Voxels & Flush Chunks Immediately
function setCoarseBlockWorld(wx, wy, wz, packedCol, isWaterBlock = false) {
  const cx = Math.round(wx), cy = Math.round(wy), cz = Math.round(wz);
  if (!inCoarse(cx, cy, cz)) return false;
  const flat = cIdx(cx, cy, cz);
  const ix = cx - GX0, iy = cy - GY0, iz = cz - GZ0;
  if (isWaterBlock) {
    waterGrid[flat] = packedCol;
    waterResult.markDirtyCell(ix, iy, iz);
  } else {
    coarseGrid[flat] = packedCol;
    if (packedCol === 0) waterGrid[flat] = 0;
    coarseResult.markDirtyCell(ix, iy, iz);
    waterResult.markDirtyCell(ix, iy, iz);
    // Also mark adjacent fine chunks if near the sculpt socket boundary
    if (cx >= FINE_WX0 - 2 && cx <= FINE_WX1 + 2 && cy >= FINE_WY0 - 2 && cy <= FINE_WY1 + 2 && cz >= FINE_WZ0 - 2 && cz <= FINE_WZ1 + 2) {
      const fix = clamp(Math.floor((cx - FINE_OX) / V_FINE), 0, FX_COUNT - 1);
      const fiy = clamp(Math.floor((cy - FINE_OY) / V_FINE), 0, FY_COUNT - 1);
      const fiz = clamp(Math.floor((cz - FINE_OZ) / V_FINE), 0, FZ_COUNT - 1);
      fineResult.markDirtyCell(fix, fiy, fiz);
    }
  }
  return true;
}

function flushAllModifiedChunks() {
  const c = coarseResult.flushDirty();
  const w = waterResult.flushDirty();
  const f = fineResult.flushDirty();
  if (c || w || f) {
    renderer.shadowMap.needsUpdate = true;
  }
}

function detonateDynamiteAt(bx, by, bz) {
  playerBlastPos.set(bx, by, bz);
  playerBlastFlash = 1.0;
  spawnBreakParticles(bx, by, bz, 0xd8cec2, 42, 1.85);

  const rad = 2.8;
  const r2 = rad * rad;
  // Carve crater in coarseGrid & waterGrid
  const x0 = Math.floor(bx - rad), x1 = Math.ceil(bx + rad);
  const y0 = Math.floor(by - rad), y1 = Math.ceil(by + rad);
  const z0 = Math.floor(bz - rad), z1 = Math.ceil(bz + rad);
  for (let y = y0; y <= y1; y++) {
    for (let z = z0; z <= z1; z++) {
      for (let x = x0; x <= x1; x++) {
        if ((x - bx) * (x - bx) + (y - by) * (y - by) + (z - bz) * (z - bz) <= r2) {
          if (inCoarse(x, y, z)) {
            const flat = cIdx(x, y, z);
            if (coarseGrid[flat] !== 0 || waterGrid[flat] !== 0) {
              coarseGrid[flat] = 0;
              waterGrid[flat] = 0;
              coarseResult.markDirtyCell(x - GX0, y - GY0, z - GZ0);
              waterResult.markDirtyCell(x - GX0, y - GY0, z - GZ0);
            }
          }
        }
      }
    }
  }

  // Carve crater in fineGrid if within the 4 Faces zone
  if (bx >= FINE_WX0 - rad && bx <= FINE_WX1 + rad && by >= FINE_WY0 - rad && by <= FINE_WY1 + rad && bz >= FINE_WZ0 - rad && bz <= FINE_WZ1 + rad) {
    const fx0 = clamp(Math.floor((bx - rad - FINE_OX) / V_FINE), 0, FX_COUNT - 1);
    const fx1 = clamp(Math.ceil((bx + rad - FINE_OX) / V_FINE), 0, FX_COUNT - 1);
    const fy0 = clamp(Math.floor((by - rad - FINE_OY) / V_FINE), 0, FY_COUNT - 1);
    const fy1 = clamp(Math.ceil((by + rad - FINE_OY) / V_FINE), 0, FY_COUNT - 1);
    const fz0 = clamp(Math.floor((bz - rad - FINE_OZ) / V_FINE), 0, FZ_COUNT - 1);
    const fz1 = clamp(Math.ceil((bz + rad - FINE_OZ) / V_FINE), 0, FZ_COUNT - 1);
    for (let iy = fy0; iy <= fy1; iy++) {
      const wy = FINE_OY + (iy + 0.5) * V_FINE;
      for (let iz = fz0; iz <= fz1; iz++) {
        const wz = FINE_OZ + (iz + 0.5) * V_FINE;
        for (let ix = fx0; ix <= fx1; ix++) {
          const wx = FINE_OX + (ix + 0.5) * V_FINE;
          if ((wx - bx) * (wx - bx) + (wy - by) * (wy - by) + (wz - bz) * (wz - bz) <= r2) {
            const fi = fIdx(ix, iy, iz);
            if (fineGrid[fi] !== 0) {
              fineGrid[fi] = 0;
              fineResult.markDirtyCell(ix, iy, iz);
            }
          }
        }
      }
    }
  }

  flushAllModifiedChunks();
}

// Reset Entire Island Back to Pristine State
function resetIslandMap() {
  coarseGrid.set(initialCoarseGrid);
  waterGrid.set(initialWaterGrid);
  fineGrid.set(initialFineGrid);
  coarseResult.resetAllModified();
  waterResult.resetAllModified();
  fineResult.resetAllModified();
  activeDynamites.length = 0;
  activeDebris.length = 0;
  renderer.shadowMap.needsUpdate = true;
  showToast('🔄 ¡Isla restaurada al 100 % a su estado original!');
}
window.resetIslandMap = resetIslandMap;

// Raycast from Player Eye Along Look Direction to Find Targeted Voxel
function raycastWorldVoxel() {
  const p = gameState.player;
  const eyeX = p.pos.x;
  const eyeY = p.pos.y + 1.22;
  const eyeZ = p.pos.z;

  const dirX = -Math.sin(p.yaw) * Math.cos(p.pitch);
  const dirY =  Math.sin(p.pitch);
  const dirZ = -Math.cos(p.yaw) * Math.cos(p.pitch);

  const step = 0.08;
  const maxDist = 8.5;
  let prevX = eyeX, prevY = eyeY, prevZ = eyeZ;

  for (let d = 0.35; d <= maxDist; d += step) {
    const rx = eyeX + dirX * d;
    const ry = eyeY + dirY * d;
    const rz = eyeZ + dirZ * d;
    const hit = checkWorldSolid(rx, ry, rz);
    if (hit.solid) {
      const dx = prevX - hit.cx;
      const dy = prevY - hit.cy;
      const dz = prevZ - hit.cz;
      let nx = 0, ny = 0, nz = 0;
      if (Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) >= Math.abs(dz)) nx = Math.sign(dx) || 1;
      else if (Math.abs(dy) >= Math.abs(dx) && Math.abs(dy) >= Math.abs(dz)) ny = Math.sign(dy) || 1;
      else nz = Math.sign(dz) || 1;
      return { ...hit, nx, ny, nz, placeX: Math.round(prevX), placeY: Math.round(prevY), placeZ: Math.round(prevZ) };
    }
    prevX = rx; prevY = ry; prevZ = rz;
  }
  return null;
}

// Mine / Break Targeted Block
function mineTargetedBlock() {
  gameState.player.swingTimer = 0.28;
  const hit = gameState.targetVoxel || raycastWorldVoxel();
  if (!hit) {
    showToast('Acércate un poco más a un bloque o árbol para picarlo ⛏️', 1400);
    return false;
  }
  const rgbHex = hit.packed & 0xffffff;
  spawnBreakParticles(hit.cx, hit.cy, hit.cz, rgbHex, 16, 1.0);

  if (hit.grid === 'fine') {
    // Break a small cluster of fine voxels (~0.6u radius) so mining the statue faces feels responsive!
    const rFine = 2;
    for (let dy = -rFine; dy <= rFine; dy++) {
      for (let dz = -rFine; dz <= rFine; dz++) {
        for (let dx = -rFine; dx <= rFine; dx++) {
          if (dx * dx + dy * dy + dz * dz > rFine * rFine + 1) continue;
          const nix = hit.ix + dx, niy = hit.iy + dy, niz = hit.iz + dz;
          if (nix >= 0 && nix < FX_COUNT && niy >= 0 && niy < FY_COUNT && niz >= 0 && niz < FZ_COUNT) {
            fineGrid[fIdx(nix, niy, niz)] = 0;
            fineResult.markDirtyCell(nix, niy, niz);
          }
        }
      }
    }
    flushAllModifiedChunks();
    return true;
  } else if (hit.grid === 'coarse') {
    setCoarseBlockWorld(hit.wx, hit.wy, hit.wz, 0, false);
    flushAllModifiedChunks();
    return true;
  }
  return false;
}
window.mineTargetedBlock = mineTargetedBlock;

// Place Block or Throw Dynamite
function useSelectedItem() {
  gameState.player.swingTimer = 0.28;
  const item = HOTBAR_ITEMS[gameState.selectedSlot];
  if (!item) return false;

  if (item.type === 'dynamite') {
    const p = gameState.player;
    const dirX = -Math.sin(p.yaw) * Math.cos(p.pitch);
    const dirY =  Math.sin(p.pitch);
    const dirZ = -Math.cos(p.yaw) * Math.cos(p.pitch);
    activeDynamites.push({
      x: p.pos.x + dirX * 0.6,
      y: p.pos.y + 1.15 + dirY * 0.4,
      z: p.pos.z + dirZ * 0.6,
      vx: dirX * 11.5,
      vy: dirY * 11.5 + 4.2,
      vz: dirZ * 11.5,
      age: 0,
    });
    showToast('🧨 ¡Dinamita lanzada! Explotará en 1.5 s...', 1500);
    return true;
  }

  if (item.type === 'tool') {
    return mineTargetedBlock();
  }

  const hit = gameState.targetVoxel || raycastWorldVoxel();
  if (!hit) return false;

  const px = Math.round(hit.cx + hit.nx * Math.max(0.8, hit.voxelSize));
  const py = Math.round(hit.cy + hit.ny * Math.max(0.8, hit.voxelSize));
  const pz = Math.round(hit.cz + hit.nz * Math.max(0.8, hit.voxelSize));

  // Prevent placing a solid block directly inside the player's body
  const p = gameState.player;
  if (item.type === 'block' && Math.abs(px - p.pos.x) < 0.65 && Math.abs(pz - p.pos.z) < 0.65 && py >= Math.floor(p.pos.y) && py <= Math.ceil(p.pos.y + p.height)) {
    return false;
  }

  if (setCoarseBlockWorld(px, py, pz, item.packed, item.type === 'water')) {
    spawnBreakParticles(px, py, pz, item.color, 6, 0.45);
    flushAllModifiedChunks();
    return true;
  }
  return false;
}
window.useSelectedItem = useSelectedItem;

// Player AABB Collision Helper
function checkPlayerBoxCollision(px, py, pz) {
  const r = gameState.player.radius;
  const h = gameState.player.height;
  const ySamples = [py + 0.08, py + 0.72, py + h - 0.08];
  const xOffsets = [-r, r];
  const zOffsets = [-r, r];

  let supportRide = null;
  for (let yi = 0; yi < ySamples.length; yi++) {
    const sy = ySamples[yi];
    for (let xi = 0; xi < xOffsets.length; xi++) {
      for (let zi = 0; zi < zOffsets.length; zi++) {
        const res = checkWorldSolid(px + xOffsets[xi], sy, pz + zOffsets[zi]);
        if (res.solid) {
          if (res.grid === 'islet' || res.grid === 'cloud') supportRide = res;
          return { collided: true, supportRide };
        }
      }
    }
  }
  return { collided: false, supportRide: null };
}

// Update Player Physics & Movement Each Frame
function updatePlayerPhysics(dt) {
  if (gameState.mode !== 'play') return;
  const p = gameState.player;

  // Carry player if riding the Aerial Tramway or a 1930s Truck!
  if (gameState.rideState) {
    if (gameState.rideState.type === 'tram') {
      const tp = tramCarGroup.position;
      p.pos.set(tp.x, tp.y - 2.65, tp.z);
      p.vel.set(0, 0, 0);
      p.onGround = true;
    } else if (gameState.rideState.type === 'truck') {
      const tr = movingTrucks[gameState.rideState.index || 0];
      if (tr) {
        p.pos.set(tr.grp.position.x, tr.grp.position.y + 0.95, tr.grp.position.z);
        p.vel.set(0, 0, 0);
        p.onGround = true;
      }
    }
    // Disembark if player presses Jump while riding
    if (gameState.jumpHeld || gameState.keys['Space']) {
      gameState.rideState = null;
      p.vel.y = 6.8;
      updateVehicleButtonLabel();
      showToast('Bajaste del vehículo 🏃');
    }
  } else {
    // Check if standing on a moving floating islet or voxel cloud to carry player smoothly
    const under = checkWorldSolid(p.pos.x, p.pos.y - 0.15, p.pos.z);
    if (under.solid && under.grid === 'islet') {
      const isl = floatingIslets[under.index];
      p.pos.add(isl.grp.position.clone().sub(isl.prevPos));
    } else if (under.solid && under.grid === 'cloud') {
      const cl = voxelClouds[under.index];
      p.pos.add(cl.grp.position.clone().sub(cl.prevPos));
    }

    // Input Movement Vector
    let moveFwd = 0, moveRight = 0;
    if (gameState.keys['KeyW'] || gameState.keys['ArrowUp']) moveFwd += 1;
    if (gameState.keys['KeyS'] || gameState.keys['ArrowDown']) moveFwd -= 1;
    if (gameState.keys['KeyD'] || gameState.keys['ArrowRight']) moveRight += 1;
    if (gameState.keys['KeyA'] || gameState.keys['ArrowLeft']) moveRight -= 1;

    moveFwd += -gameState.joyVec.y;
    moveRight += gameState.joyVec.x;

    const len = Math.hypot(moveFwd, moveRight);
    if (len > 1.0) { moveFwd /= len; moveRight /= len; }

    const sinY = Math.sin(p.yaw), cosY = Math.cos(p.yaw);
    const wishX = (-sinY * moveFwd + cosY * moveRight);
    const wishZ = (-cosY * moveFwd - sinY * moveRight);

    // Check water state (Blue Lake, Creek, Waterfall)
    p.inWater = isWaterAtWorld(p.pos.x, p.pos.y + 0.45, p.pos.z) || isWaterAtWorld(p.pos.x, p.pos.y + 0.1, p.pos.z);

    const speed = p.flying ? 14.5 : (p.inWater ? 5.6 : 7.8);
    p.vel.x = wishX * speed;
    p.vel.z = wishZ * speed;

    const wantJump = gameState.jumpHeld || !!gameState.keys['Space'];
    const wantDown = gameState.flyDownHeld || !!gameState.keys['ShiftLeft'] || !!gameState.keys['ShiftRight'] || !!gameState.keys['KeyC'];

    if (p.flying) {
      p.vel.y = 0;
      if (wantJump) p.vel.y = 9.5;
      if (wantDown) p.vel.y = -9.5;
      // Also allow flying in pitch direction when pressing forward
      if (!wantJump && !wantDown && Math.abs(moveFwd) > 0.15) {
        p.vel.y = Math.sin(p.pitch) * moveFwd * 10.5;
      }
    } else if (p.inWater) {
      // Swimming buoyancy in the Blue Lake!
      p.vel.y -= 5.5 * dt;
      p.vel.y = Math.max(p.vel.y, -2.6);
      if (wantJump) p.vel.y = 4.6;
    } else {
      // Standard Gravity & Jump
      p.vel.y -= 24.0 * dt;
      p.vel.y = Math.max(p.vel.y, -32.0);
      if (wantJump && p.onGround) {
        p.vel.y = 9.2;
        p.onGround = false;
      }
    }

    // Move X + Auto-Step 1-block ledges
    const nextX = p.pos.x + p.vel.x * dt;
    if (!checkPlayerBoxCollision(nextX, p.pos.y, p.pos.z).collided) {
      p.pos.x = nextX;
    } else if ((p.onGround || p.inWater) && !checkPlayerBoxCollision(nextX, p.pos.y + 1.05, p.pos.z).collided) {
      p.pos.x = nextX;
      p.pos.y += 1.05;
    }

    // Move Z + Auto-Step 1-block ledges
    const nextZ = p.pos.z + p.vel.z * dt;
    if (!checkPlayerBoxCollision(p.pos.x, p.pos.y, nextZ).collided) {
      p.pos.z = nextZ;
    } else if ((p.onGround || p.inWater) && !checkPlayerBoxCollision(p.pos.x, p.pos.y + 1.05, nextZ).collided) {
      p.pos.z = nextZ;
      p.pos.y += 1.05;
    }

    // Move Y
    const nextY = p.pos.y + p.vel.y * dt;
    if (!checkPlayerBoxCollision(p.pos.x, nextY, p.pos.z).collided) {
      p.pos.y = nextY;
      p.onGround = false;
    } else {
      if (p.vel.y < 0) p.onGround = true;
      p.vel.y = 0;
    }

    // Void-Fall Auto-Respawn if player digs through bottom or falls off the floating island!
    if (p.pos.y < -35.0) {
      p.pos.set(0.0, 8.0, 38.5);
      p.vel.set(0, 0, 0);
      p.flying = false;
      updateFlyButtonUI();
      showToast('⚠️ ¡Caíste al vacío! Respawn automático en la isla 🇸🇻');
    }

    // Walk animation cycle
    const horizSpd = Math.hypot(p.vel.x, p.vel.z);
    if (horizSpd > 0.25) {
      p.walkCycle += dt * (p.inWater ? 7.0 : 11.0);
    } else {
      p.walkCycle *= 0.85;
    }
  }

  if (p.swingTimer > 0) {
    p.swingTimer = Math.max(0, p.swingTimer - dt);
  }

  // Update status pill when swimming or riding
  const statusEl = document.getElementById('status-pill');
  if (statusEl && gameState.mode === 'play') {
    if (gameState.rideState) {
      statusEl.textContent = gameState.rideState.type === 'tram'
        ? '🚡 Viajando en el Teleférico — Pulsa Saltar o «Bajarse» cuando quieras'
        : '🚚 Viajando en Camión de 1939 — Pulsa Saltar o «Bajarse» cuando quieras';
    } else if (p.inWater) {
      statusEl.textContent = '🌊 Nadando en el Lago Azul — Mantén Saltar para subir a la superficie';
    } else if (p.flying) {
      statusEl.textContent = '🕊️ Modo Vuelo Activo — Sube a las nubes, islas flotantes o las 4 caras';
    } else {
      const item = HOTBAR_ITEMS[gameState.selectedSlot];
      statusEl.textContent = `🎮 Modo Jugador (${gameState.thirdPerson ? '3ª' : '1ª'} Persona) • Mano: ${item.icon} ${item.name}`;
    }
  }
}

function updatePlayerCamera(t) {
  const p = gameState.player;
  const item = HOTBAR_ITEMS[gameState.selectedSlot];

  // Update targeted voxel cursor
  gameState.targetVoxel = raycastWorldVoxel();
  if (gameState.targetVoxel) {
    const tv = gameState.targetVoxel;
    voxelCursorMesh.visible = true;
    voxelCursorMesh.position.set(tv.cx, tv.cy, tv.cz);
    const s = tv.voxelSize * 1.03;
    voxelCursorMesh.scale.set(s, s, s);
  } else {
    voxelCursorMesh.visible = false;
  }

  // Animate player avatar limbs
  const swing = p.swingTimer > 0 ? Math.sin((p.swingTimer / 0.28) * Math.PI) * 1.35 : 0;
  const stride = Math.sin(p.walkCycle) * 0.65 * (Math.hypot(p.vel.x, p.vel.z) > 0.2 ? 1 : 0);
  avLegL.pivot.rotation.x = stride;
  avLegR.pivot.rotation.x = -stride;
  avArmL.pivot.rotation.x = -stride * 0.8;
  avArmR.pivot.rotation.x = -0.35 - swing + stride * 0.5;
  avHead.pivot.rotation.x = p.pitch * 0.65;

  const lookDir = new THREE.Vector3(
    -Math.sin(p.yaw) * Math.cos(p.pitch),
     Math.sin(p.pitch),
    -Math.cos(p.yaw) * Math.cos(p.pitch)
  ).normalize();

  if (gameState.thirdPerson) {
    playerAvatarGroup.visible = true;
    fpHandGroup.visible = false;
    playerAvatarGroup.position.copy(p.pos);
    playerAvatarGroup.rotation.y = p.yaw + Math.PI;

    // Smooth 3rd-person camera with obstacle pullback
    const eyePos = new THREE.Vector3(p.pos.x, p.pos.y + 1.28, p.pos.z);
    let camDist = 3.8;
    for (let d = 0.6; d <= 3.8; d += 0.25) {
      const cx = eyePos.x - lookDir.x * d;
      const cy = eyePos.y - lookDir.y * d + 0.25;
      const cz = eyePos.z - lookDir.z * d;
      if (checkWorldSolid(cx, cy, cz).solid) {
        camDist = Math.max(0.55, d - 0.30);
        break;
      }
    }
    camera.position.set(
      eyePos.x - lookDir.x * camDist,
      eyePos.y - lookDir.y * camDist + 0.25,
      eyePos.z - lookDir.z * camDist
    );
    camera.lookAt(eyePos.x + lookDir.x * 6.0, eyePos.y + lookDir.y * 6.0, eyePos.z + lookDir.z * 6.0);
  } else {
    // 1st-Person View + Held Item in Right Hand
    playerAvatarGroup.visible = false;
    fpHandGroup.visible = true;
    const eyePos = new THREE.Vector3(p.pos.x, p.pos.y + 1.24, p.pos.z);
    camera.position.copy(eyePos);
    camera.lookAt(eyePos.x + lookDir.x * 10.0, eyePos.y + lookDir.y * 10.0, eyePos.z + lookDir.z * 10.0);

    const rightVec = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
    const upVec = new THREE.Vector3(0, 1, 0);
    const bob = Math.sin(p.walkCycle * 1.5) * 0.025 * (Math.hypot(p.vel.x, p.vel.z) > 0.2 ? 1 : 0);
    fpHandGroup.position.copy(eyePos)
      .addScaledVector(lookDir, 0.58 - swing * 0.12)
      .addScaledVector(rightVec, 0.28)
      .addScaledVector(upVec, -0.22 + bob - swing * 0.08);
    fpHandGroup.rotation.set(p.pitch - 0.35 - swing * 0.8, p.yaw, -0.15);

    const isTool = item.type === 'tool';
    fpPickShaft.pivot.visible = isTool;
    fpPickHead.pivot.visible = isTool;
    fpBlockMesh.pivot.visible = !isTool;
  }
}

// Build Hotbar UI & Bind Controls
function initInteractiveUI() {
  const hotbarEl = document.getElementById('hotbar');
  if (!hotbarEl) return;
  hotbarEl.innerHTML = '';
  HOTBAR_ITEMS.forEach((item, idx) => {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (idx === gameState.selectedSlot ? ' selected' : '');
    slot.innerHTML = `<span class="slot-key">${idx + 1}</span><span class="slot-icon">${item.icon}</span><span>${item.name}</span>`;
    slot.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selectHotbarSlot(idx);
    });
    hotbarEl.appendChild(slot);
  });
}

function selectHotbarSlot(idx) {
  gameState.selectedSlot = clamp(idx, 0, HOTBAR_ITEMS.length - 1);
  const slots = document.querySelectorAll('.hotbar-slot');
  slots.forEach((el, i) => el.classList.toggle('selected', i === gameState.selectedSlot));

  const item = HOTBAR_ITEMS[gameState.selectedSlot];
  const col = new THREE.Color(item.color || 0xffffff);
  for (const part of [avToolHead, fpBlockMesh]) {
    const arr = part.mesh.geometry.attributes.color.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i] = col.r; arr[i + 1] = col.g; arr[i + 2] = col.b;
    }
    part.mesh.geometry.attributes.color.needsUpdate = true;
  }
}

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

function setGameMode(newMode) {
  gameState.mode = newMode;
  const btnMode = document.getElementById('btn-mode');
  const btnPov = document.getElementById('btn-pov');
  const btnFly = document.getElementById('btn-fly');
  const btnVehicle = document.getElementById('btn-vehicle');
  const btnTeleport = document.getElementById('btn-teleport');
  const hotbar = document.getElementById('hotbar');
  const crosshair = document.getElementById('crosshair');
  const touchControls = document.getElementById('touch-controls');
  const helpCard = document.getElementById('help-card');
  const statusEl = document.getElementById('status-pill');

  if (newMode === 'play') {
    camera.fov = 62;
    camera.near = 0.12;
    camera.updateProjectionMatrix();

    btnMode.textContent = '🎬 Modo Panorámico';
    btnMode.classList.add('active-mode');
    btnPov.style.display = 'inline-flex';
    btnFly.style.display = 'inline-flex';
    btnVehicle.style.display = 'inline-flex';
    btnTeleport.style.display = 'inline-flex';
    hotbar.style.display = 'flex';
    crosshair.style.display = 'block';
    touchControls.style.display = (isTouchDevice || window.innerWidth <= 900) ? 'block' : 'none';
    helpCard.style.display = (!isTouchDevice && window.innerWidth > 900) ? 'block' : 'none';

    showToast('🇸🇻 ¡Bienvenido a la isla! Camina, nada en el lago, sube al teleférico o pica bloques');
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    camera.fov = 35;
    camera.near = 1.0;
    camera.updateProjectionMatrix();

    playerAvatarGroup.visible = false;
    fpHandGroup.visible = false;
    voxelCursorMesh.visible = false;

    btnMode.textContent = '🎮 Entrar a la Isla (Respawn)';
    btnMode.classList.remove('active-mode');
    btnPov.style.display = 'none';
    btnFly.style.display = 'none';
    btnVehicle.style.display = 'none';
    btnTeleport.style.display = 'none';
    hotbar.style.display = 'none';
    crosshair.style.display = 'none';
    touchControls.style.display = 'none';
    helpCard.style.display = 'none';
    if (statusEl) statusEl.textContent = '🎬 Modo Panorámico — Arrastra para mirar o pulsa «Entrar a la Isla (Respawn)»';
  }
}
window.setGameMode = setGameMode;

function updateFlyButtonUI() {
  const btnFly = document.getElementById('btn-fly');
  const tbtnFly = document.getElementById('tbtn-fly');
  const on = gameState.player.flying;
  if (btnFly) {
    btnFly.textContent = on ? '🕊️ Volar: ON' : '🕊️ Volar: OFF';
    btnFly.classList.toggle('active-mode', on);
  }
  if (tbtnFly) tbtnFly.classList.toggle('fly-on', on);
}

function toggleFlying() {
  gameState.rideState = null;
  gameState.player.flying = !gameState.player.flying;
  gameState.player.vel.y = 0;
  updateFlyButtonUI();
  updateVehicleButtonLabel();
  showToast(gameState.player.flying ? '🕊️ ¡Vuelo activado! Puedes subir a las nubes y a las caras' : '🏃 Modo caminar con gravedad activado', 1600);
}

function updateVehicleButtonLabel() {
  const btnVehicle = document.getElementById('btn-vehicle');
  if (!btnVehicle) return;
  if (!gameState.rideState) {
    btnVehicle.textContent = '🚡 Subir al Teleférico';
  } else if (gameState.rideState.type === 'tram') {
    btnVehicle.textContent = '🚚 Cambiar a Camión';
  } else {
    btnVehicle.textContent = '🏃 Bajarse del Vehículo';
  }
}

function cycleVehicleRide() {
  if (gameState.mode !== 'play') setGameMode('play');
  if (!gameState.rideState) {
    gameState.rideState = { type: 'tram' };
    gameState.player.flying = false;
    updateFlyButtonUI();
    showToast('🚡 ¡Subiste al Teleférico rumbo a la cima!');
  } else if (gameState.rideState.type === 'tram') {
    gameState.rideState = { type: 'truck', index: 0 };
    showToast('🚚 ¡Subiste al Camión de 1939 por la carretera!');
  } else {
    gameState.rideState = null;
    gameState.player.vel.y = 5.0;
    showToast('🏃 Bajaste del vehículo');
  }
  updateVehicleButtonLabel();
}
window.cycleVehicleRide = cycleVehicleRide;

function cycleTeleportSpot() {
  if (gameState.mode !== 'play') setGameMode('play');
  gameState.rideState = null;
  updateVehicleButtonLabel();
  gameState.teleportIdx = (gameState.teleportIdx + 1) % TELEPORT_SPOTS.length;
  const sp = TELEPORT_SPOTS[gameState.teleportIdx];
  gameState.player.pos.copy(sp.pos);
  gameState.player.vel.set(0, 0, 0);
  gameState.player.yaw = sp.yaw;
  gameState.player.pitch = sp.pitch;
  gameState.player.flying = !!sp.fly;
  updateFlyButtonUI();
  const btnTeleport = document.getElementById('btn-teleport');
  if (btnTeleport) btnTeleport.textContent = `📍 Ir a: ${sp.name}`;
  showToast(`📍 Teletransportado a: ${sp.name}`);
}

// Bind Top Bar Buttons
document.getElementById('btn-mode')?.addEventListener('click', () => {
  setGameMode(gameState.mode === 'play' ? 'showcase' : 'play');
});
document.getElementById('btn-pov')?.addEventListener('click', () => {
  gameState.thirdPerson = !gameState.thirdPerson;
  const btnPov = document.getElementById('btn-pov');
  if (btnPov) btnPov.textContent = gameState.thirdPerson ? '👁️ 3ª Persona' : '👁️ 1ª Persona';
  showToast(gameState.thirdPerson ? '👁️ Vista en 3ª Persona (Muñequito visible)' : '👁️ Vista en 1ª Persona');
});
document.getElementById('btn-fly')?.addEventListener('click', toggleFlying);
document.getElementById('btn-vehicle')?.addEventListener('click', cycleVehicleRide);
document.getElementById('btn-teleport')?.addEventListener('click', cycleTeleportSpot);
document.getElementById('btn-reset')?.addEventListener('click', resetIslandMap);

// Keyboard Listeners (PC)
window.addEventListener('keydown', (e) => {
  gameState.keys[e.code] = true;
  if (e.code === 'Space') {
    const now = performance.now();
    if (gameState.mode === 'play' && now - gameState.lastSpaceTime < 320) {
      toggleFlying();
      gameState.lastSpaceTime = 0;
    } else {
      gameState.lastSpaceTime = now;
    }
  } else if (e.code === 'KeyF' && gameState.mode === 'play') {
    toggleFlying();
  } else if (e.code === 'KeyV' && gameState.mode === 'play') {
    document.getElementById('btn-pov')?.click();
  } else if (e.code === 'KeyE' && gameState.mode === 'play') {
    cycleVehicleRide();
  } else if (e.code === 'KeyR') {
    resetIslandMap();
  } else if (e.code.startsWith('Digit')) {
    const num = parseInt(e.code.replace('Digit', ''), 10);
    if (num >= 1 && num <= HOTBAR_ITEMS.length) selectHotbarSlot(num - 1);
  }
});
window.addEventListener('keyup', (e) => {
  gameState.keys[e.code] = false;
});

// Mouse / Pointer Look & Mining/Building on Canvas
const canvasEl = renderer.domElement;
canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());

let lookPointerId = null;
let lookStartX = 0, lookStartY = 0, lookLastX = 0, lookLastY = 0, lookMoved = false;

canvasEl.addEventListener('pointerdown', (e) => {
  if (gameState.mode === 'showcase') {
    showcaseDrag.active = true;
    showcaseDrag.lastX = e.clientX;
    showcaseDrag.lastY = e.clientY;
    return;
  }

  // On PC with mouse, click locks pointer or mines/uses directly
  if (e.pointerType === 'mouse') {
    if (document.pointerLockElement !== canvasEl) {
      canvasEl.requestPointerLock?.();
    } else {
      if (e.button === 0) mineTargetedBlock();
      else if (e.button === 2) useSelectedItem();
    }
    return;
  }

  // On Mobile / Touch: right or center screen drag rotates camera; quick tap mines/places!
  if (lookPointerId === null) {
    lookPointerId = e.pointerId;
    lookStartX = lookLastX = e.clientX;
    lookStartY = lookLastY = e.clientY;
    lookMoved = false;
    document.getElementById('touch-controls').style.display = 'block';
  }
});

window.addEventListener('pointermove', (e) => {
  if (gameState.mode === 'showcase' && showcaseDrag.active) {
    const dx = e.clientX - showcaseDrag.lastX;
    const dy = e.clientY - showcaseDrag.lastY;
    showcaseDrag.lastX = e.clientX;
    showcaseDrag.lastY = e.clientY;
    showcaseDrag.yawOffset -= dx * 0.0055;
    showcaseDrag.pitchOffset = clamp(showcaseDrag.pitchOffset + dy * 0.004, -0.7, 0.9);
    return;
  }

  if (gameState.mode === 'play') {
    if (document.pointerLockElement === canvasEl) {
      gameState.player.yaw -= e.movementX * 0.0032;
      gameState.player.pitch = clamp(gameState.player.pitch - e.movementY * 0.0030, -1.42, 1.42);
      return;
    }
    if (e.pointerId === lookPointerId) {
      const dx = e.clientX - lookLastX;
      const dy = e.clientY - lookLastY;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
      if (Math.hypot(e.clientX - lookStartX, e.clientY - lookStartY) > 10) lookMoved = true;
      gameState.player.yaw -= dx * 0.0055;
      gameState.player.pitch = clamp(gameState.player.pitch - dy * 0.0050, -1.42, 1.42);
    }
  }
});

window.addEventListener('pointerup', (e) => {
  showcaseDrag.active = false;
  if (e.pointerId === lookPointerId) {
    if (!lookMoved && gameState.mode === 'play') {
      // Quick tap on screen in mobile mode uses/mines the targeted voxel
      useSelectedItem();
    }
    lookPointerId = null;
  }
});

window.addEventListener('wheel', (e) => {
  if (gameState.mode === 'showcase') {
    showcaseDrag.zoomOffset = clamp(showcaseDrag.zoomOffset + e.deltaY * 0.08, -110, 65);
  } else if (gameState.mode === 'play') {
    const dir = Math.sign(e.deltaY);
    selectHotbarSlot((gameState.selectedSlot + dir + HOTBAR_ITEMS.length) % HOTBAR_ITEMS.length);
  }
}, { passive: true });

// Mobile Virtual Thumbstick (Roblox / Minecraft Style)
{
  const joyZone = document.getElementById('joystick-zone');
  const joyKnob = document.getElementById('joystick-knob');
  let joyPointerId = null;

  function updateJoystick(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const maxR = rect.width * 0.38;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    gameState.joyVec.x = dx / maxR;
    gameState.joyVec.y = dy / maxR;
  }

  joyZone?.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    joyPointerId = e.pointerId;
    joyZone.setPointerCapture?.(e.pointerId);
    updateJoystick(e.clientX, e.clientY);
  });
  joyZone?.addEventListener('pointermove', (e) => {
    if (e.pointerId === joyPointerId) {
      e.stopPropagation();
      updateJoystick(e.clientX, e.clientY);
    }
  });
  const resetJoy = (e) => {
    if (e.pointerId === joyPointerId) {
      joyPointerId = null;
      joyKnob.style.transform = 'translate(0px, 0px)';
      gameState.joyVec.x = 0;
      gameState.joyVec.y = 0;
    }
  };
  joyZone?.addEventListener('pointerup', resetJoy);
  joyZone?.addEventListener('pointercancel', resetJoy);

  // Mobile Action Buttons
  const tbtnJump = document.getElementById('tbtn-jump');
  tbtnJump?.addEventListener('pointerdown', (e) => { e.stopPropagation(); gameState.jumpHeld = true; tbtnJump.classList.add('pressed'); });
  tbtnJump?.addEventListener('pointerup', (e) => { e.stopPropagation(); gameState.jumpHeld = false; tbtnJump.classList.remove('pressed'); });
  tbtnJump?.addEventListener('pointercancel', () => { gameState.jumpHeld = false; tbtnJump.classList.remove('pressed'); });

  document.getElementById('tbtn-fly')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); toggleFlying(); });
  document.getElementById('tbtn-mine')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); mineTargetedBlock(); });
  document.getElementById('tbtn-use')?.addEventListener('pointerdown', (e) => { e.stopPropagation(); useSelectedItem(); });
}

initInteractiveUI();
if (params.get('mode') === 'play') setGameMode('play');

let manualCaptureMode = false;
function renderAt(t) {
  manualCaptureMode = true;
  const safeT = Number.isFinite(t) ? t : 0.0;
  updateSceneAtTime(safeT);
  composer.render();
}
window.renderAt = renderAt;

window.__SCENE_STATS__ = {
  width: WIDTH,
  height: HEIGHT,
  duration: DURATION,
  coarseFaces: coarseResult.totalFaces,
  fineFaces: fineResult.totalFaces,
  waterFaces: waterResult.totalFaces,
  coarseChunks: coarseResult.group.children.length,
  fineChunks: fineResult.group.children.length,
  peopleCount: PEOPLE.length,
  interactiveReady: true,
};
window.__GAME_STATE__ = gameState;

updateSceneAtTime(0.0);
composer.render();
window.__SCENE_READY__ = true;

const clockStart = performance.now();
let prevFrameNow = clockStart;
function animateLoop(now) {
  if (manualCaptureMode) return;
  const dt = clamp((now - prevFrameNow) / 1000.0, 0.001, 0.08);
  prevFrameNow = now;
  const totalElapsed = (now - clockStart) / 1000.0;

  // Save previous positions of floating islets & clouds so player can ride them
  for (let i = 0; i < floatingIslets.length; i++) {
    floatingIslets[i].prevPos.copy(floatingIslets[i].grp.position);
  }
  for (let i = 0; i < voxelClouds.length; i++) {
    voxelClouds[i].prevPos.copy(voxelClouds[i].grp.position);
  }

  const animTime = gameState.mode === 'showcase' ? (totalElapsed % DURATION) : totalElapsed;
  updateSceneAtTime(animTime);
  if (gameState.mode === 'play') {
    updatePlayerPhysics(dt);
    updatePlayerCamera(animTime);
  }
  composer.render();
  requestAnimationFrame(animateLoop);
}
requestAnimationFrame(animateLoop);
</script>
